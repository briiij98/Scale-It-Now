[build]
  publish = "public"
  functions = "netlify/functions"
  # Build guard only: fails the build if any server-side secret value (or secret-looking key) would be published. Nothing is
  # generated into public/ from environment variables - the browser needs no keys. Netlify's own secret scanning stays ON.
  command = "node scripts/verify-public-build.js"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  # data/*.json is read by the functions at runtime
  included_files = ["data/**"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Pages that handle the private access link are never cached or indexed.
[[headers]]
  for = "/access.html"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
[[headers]]
  for = "/success.html"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
